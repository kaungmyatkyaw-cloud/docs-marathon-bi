site_name: Marathon BI Documentation
site_description: Unified Data Warehouse — BI team of Marathon Myanmar
site_url: https://docs-marathon-bi.kaungmyatkyaw.workers.dev/

repo_name: kaungmyatkyaw-cloud/docs-marathon-bi
repo_url: https://github.com/kaungmyatkyaw-cloud/docs-marathon-bi

theme:
  name: material
  logo: assets/logo.webp
  favicon: assets/logo.webp
  language: en
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs            # ← required for hover dropdowns
    - navigation.tabs.sticky     # tabs stay visible while scrolling
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/justice-theme.css

extra_javascript:
  - javascripts/anim.js

nav:
  - Home: index.md
  - Announcements: announcements.md
  - Library:
      - 📚 Library Index: library/index.md
      - Reports Catalog: library/reports-catalog.md
      - Forms & Templates: library/forms-index.md
      - BI Skills Matrix: library/skills-matrix.md
      - 🎬 BI Video Playlist: library/bi-playlist.md
      - Technical Glossary: library/glossary.md
  - Our Work:
      - Projects & Status: projects/index.md
      - Daily Routine: projects/daily-routine.md
      - Epic 1 · Source Analysis: projects/epic-1-source-analysis.md
      - Epic 2 · Infrastructure & ETL: projects/epic-2-infrastructure-etl.md
      - Epic 3 · MDM & DW Build: projects/epic-3-mdm-dw.md
      - Epic 4 · Performance & BI: projects/epic-4-performance-bi.md
      - Epic 4 · OKR & KPI Framework: projects/epic-4-okr-kpi-framework.md
      - Epic 5 · Zammad / Ticket Mgmt: projects/epic-5-zammad-integration.md
  - Documentation:
      - ETL Guide: guides/etl-guide.md
      - Email Distribution: guides/email-distribution.md
      - Report Automation (GAS): guides/report-automation.md
      - Database Schema: appendix/database-schema.md
  - Policies & Terms:
      - Data Governance: policies/data-governance.md
      - ETL Runbook: policies/etl-runbook.md
      - Ticket Priority & SLA: policies/ticket-sla-guidelines.md
      - IT Acceptable Use: policies/it-acceptable-use.md
      - Data Usage Terms: terms/data-usage.md
  - Insights: insights.md
  - Business:
      - BI as a Service: business/bi-as-a-service.md
  - About Us:
      - What We Do: what-we-do.md
      - Who We Are: about.md
      - Sustainability: sustainability.md
      - Contact: contact.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:                                   # ← THIS renders the icons
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search