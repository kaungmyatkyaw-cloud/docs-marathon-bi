site_name: Marathon BI Documentation
site_description: Unified Data Warehouse - Documentation Library
site_url: https://kaungmyatkyaw-cloud.github.io/docs-marathon-bi/

theme:
  name: material
  logo: material/scale-balance     # ⚖️ scales icon in the header
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/justice-theme.css

extra_javascript:
  - javascripts/anim.js

repo_name: kaungmyatkyaw-cloud/docs-marathon-bi
repo_url: https://github.com/kaungmyatkyaw-cloud/docs-marathon-bi

nav:
  - Home: index.md
  - What We Do: what-we-do.md
  - Who We Are: about.md
  - Our Work:
      - Projects & Status: projects/index.md
      - Daily Routine: projects/daily-routine.md
      - Epic 1 · Source Analysis: projects/epic-1-source-analysis.md
      - Epic 2 · Infrastructure & ETL: projects/epic-2-infrastructure-etl.md
      - Epic 3 · MDM & DW Build: projects/epic-3-mdm-dw.md
      - Epic 4 · Performance & BI: projects/epic-4-performance-bi.md
  - Documentation:
      - ETL Guide: guides/etl-guide.md
      - Database Schema: appendix/database-schema.md
  - Policies & Terms:
      - Data Governance: policies/data-governance.md
      - ETL Runbook: policies/etl-runbook.md
      - Data Usage Terms: terms/data-usage.md
  - Insights: insights.md
  - Contact: contact.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
